# Smite 2 APM Tracker configuration.
# Place this file next to the executable.

# Host used to measure latency. Set this to the server region you play on;
# Smite 2 runs on AWS, so an AWS regional endpoint close to your game server
# gives a representative number (e.g. ec2.us-east-1.amazonaws.com).
ping_host = 1.1.1.1

ping_interval_ms = 1000
ping_timeout_ms = 1000

# Sliding window for the APM calculation.
apm_window_seconds = 60

# Overlay position (top-left corner) and font size.
overlay_x = 20
overlay_y = 20
font_size = 16
