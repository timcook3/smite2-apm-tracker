# Smite 2 APM Tracker configuration.
# Place this file next to the executable.

# When true, the tracker finds the running Smite 2 process, reads its
# server connections, and measures latency to the actual game server.
auto_detect_server = true

# Executable name of the game process used for auto-detection.
game_process_name = Smite2-Win64-Shipping.exe

# Fallback host, pinged only when the game/server cannot be detected (shown
# with a trailing '*' in the overlay). Set to a host near your play region.
ping_host = 1.1.1.1

ping_interval_ms = 1000
ping_timeout_ms = 1000

# Sliding window for the APM calculation.
apm_window_seconds = 60

# Overlay position (top-left corner) and font size.
overlay_x = 20
overlay_y = 20
font_size = 16
